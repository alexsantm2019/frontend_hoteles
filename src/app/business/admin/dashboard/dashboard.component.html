<div class="p-24">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="f-s-24 f-w-700 m-0">Administración SaaS</h2>
    <button mat-flat-button color="primary">
      <i-tabler name="plus" class="icon-18 me-2"></i-tabler> Nueva Empresa
    </button>
  </div>

  @if (cargando()) {
    <div class="text-center p-5"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <div class="row">
      @for (empresa of empresas(); track empresa.id) {
        <div class="col-md-4 mb-4">
          <mat-card>
            <mat-card-header>
              <mat-card-title>{{ empresa.nombre }}</mat-card-title>
              <mat-card-subtitle>RUC: {{ empresa.ruc }}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
              <p>Hoteles: {{ empresa.hoteles?.length || 0 }}</p>
            </mat-card-content>
          </mat-card>
        </div>
      } @empty {
        <div class="text-muted text-center">No hay empresas registradas.</div>
      }
    </div>
  }
</div>
