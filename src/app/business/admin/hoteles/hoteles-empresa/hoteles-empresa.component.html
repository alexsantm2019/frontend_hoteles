<h2 mat-dialog-title>Hoteles de {{ data.empresaNombre }}</h2>
<mat-dialog-content class="mat-typography">
  <div class="d-flex justify-content-end mb-3">
    <button mat-flat-button color="primary" (click)="abrirFormulario()">
      <i-tabler name="plus" class="icon-18 me-2"></i-tabler> Añadir Hotel
    </button>
  </div>

  @if (cargando()) {
    <div class="text-center p-5"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <table mat-table [dataSource]="hoteles()" class="w-100">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let h">
          <strong>{{ h.nombre }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="direccion">
        <th mat-header-cell *matHeaderCellDef>Dirección</th>
        <td mat-cell *matCellDef="let h">
          {{ h.direccion || "Sin dirección" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="text-end">Acciones</th>
        <td mat-cell *matCellDef="let h" class="text-end">
          <button mat-icon-button color="primary" (click)="abrirFormulario(h)">
            <i-tabler name="edit" class="icon-18"></i-tabler>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarHotel(h)">
            <i-tabler name="trash" class="icon-18"></i-tabler>
          </button>
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="['nombre', 'direccion', 'acciones']"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: ['nombre', 'direccion', 'acciones']"
      ></tr>
    </table>
    @if (hoteles().length === 0) {
      <div class="text-center text-muted py-3">No hay hoteles registrados.</div>
    }
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
