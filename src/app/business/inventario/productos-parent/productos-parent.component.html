<div class="p-24">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="f-s-24 f-w-700 m-0">Catálogo de Productos</h2>
    <button mat-flat-button color="primary" (click)="abrirFormulario()">
      <i-tabler name="plus" class="icon-18 me-2"></i-tabler> Nuevo Producto
    </button>
  </div>

  @if (cargando()) {
    <div class="text-center p-5"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <mat-card>
      <mat-card-content class="p-0">
        <table mat-table [dataSource]="productos()" class="w-100">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Producto</th>
            <td mat-cell *matCellDef="let p">
              <strong>{{ p.nombre }}</strong>
              <div class="text-muted f-s-12">{{ p.categoria }}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="precios">
            <th mat-header-cell *matHeaderCellDef>Compra / Venta</th>
            <td mat-cell *matCellDef="let p">
              <div class="text-muted f-s-12">C: ${{ p.precio_compra }}</div>
              <div class="text-primary f-w-600">V: ${{ p.precio_venta }}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="text-end">Acciones</th>
            <td mat-cell *matCellDef="let p" class="text-end">
              <button
                mat-icon-button
                color="primary"
                (click)="abrirFormulario(p)"
                matTooltip="Editar Producto"
              >
                <i-tabler name="edit" class="icon-18"></i-tabler>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="eliminarProducto(p)"
                matTooltip="Eliminar Producto"
              >
                <i-tabler name="trash" class="icon-18"></i-tabler>
              </button>
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="['nombre', 'precios', 'acciones']"
          ></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: ['nombre', 'precios', 'acciones']"
          ></tr>
        </table>
        @if (productos().length === 0) {
          <div class="p-4 text-center text-muted">
            No hay productos registrados.
          </div>
        }
      </mat-card-content>
    </mat-card>
  }
</div>
