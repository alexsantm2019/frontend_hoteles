<h2 mat-dialog-title>Cargar Servicio a la Reserva {{ data.reserva.codigo }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-col gap-3 pt-2">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Seleccionar Servicio</mat-label>
      <mat-select formControlName="servicio">
        @for (serv of serviciosHotel; track serv.id) {
          <mat-option [value]="serv.id"
            >{{ serv.nombre }} (${{ serv.precio }})</mat-option
          >
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="cantidad" min="1" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="form.invalid || guardando"
    (click)="guardar()"
  >
    Cargar
  </button>
</mat-dialog-actions>
