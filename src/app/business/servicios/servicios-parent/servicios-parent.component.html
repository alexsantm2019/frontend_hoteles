<div class="p-24">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="f-s-24 f-w-700 m-0">Catálogo de Servicios</h2>
    <button mat-flat-button color="primary" (click)="abrirFormulario()">
      <i-tabler name="plus" class="icon-18 me-2"></i-tabler>
      Nuevo Servicio
    </button>
  </div>

  @if (cargando()) {
    <div class="text-center p-5"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <mat-card>
      <mat-card-content class="p-0">
        <table mat-table [dataSource]="servicios()" class="w-100">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Servicio</th>
            <td mat-cell *matCellDef="let s">
              <strong>{{ s.nombre }}</strong>
              <div class="text-muted f-s-12">{{ s.descripcion }}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="precio">
            <th mat-header-cell *matHeaderCellDef>Precio</th>
            <td mat-cell *matCellDef="let s">${{ s.precio }}</td>
          </ng-container>

          <ng-container matColumnDef="unidad">
            <th mat-header-cell *matHeaderCellDef>Unidad de Cobro</th>
            <td mat-cell *matCellDef="let s">
              <span class="badge bg-light-primary text-primary">{{
                getNombreUnidad(s.unidad_cobro)
              }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="text-end">Acciones</th>
            <td mat-cell *matCellDef="let s" class="text-end">
              <button
                mat-icon-button
                color="primary"
                (click)="abrirFormulario(s)"
              >
                <i-tabler name="edit" class="icon-18"></i-tabler>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="eliminarServicio(s)"
              >
                <i-tabler name="trash" class="icon-18"></i-tabler>
              </button>
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="['nombre', 'precio', 'unidad', 'acciones']"
          ></tr>
          <tr
            mat-row
            *matRowDef="
              let row;
              columns: ['nombre', 'precio', 'unidad', 'acciones']
            "
          ></tr>
        </table>
        @if (servicios().length === 0) {
          <div class="p-4 text-center text-muted">
            No hay servicios registrados.
          </div>
        }
      </mat-card-content>
    </mat-card>
  }
</div>
