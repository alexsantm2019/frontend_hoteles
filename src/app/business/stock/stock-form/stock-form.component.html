<h2 mat-dialog-title>
  {{ esIngreso ? "Ingresar Stock a Bodega" : "Transferir a Habitación" }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-col gap-3 pt-2">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Producto</mat-label>
      <mat-select formControlName="producto_id">
        @for (prod of productos; track prod.id) {
          <mat-option [value]="prod.id">{{ prod.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Cantidad</mat-label>
      <input
        matInput
        type="number"
        formControlName="cantidad"
        appOnlyNumbers
        min="1"
      />
    </mat-form-field>

    @if (!esIngreso) {
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Habitación Destino</mat-label>
        <mat-select formControlName="habitacion_id">
          @for (hab of habitaciones; track hab.id) {
            <mat-option [value]="hab.id"
              >Hab. {{ hab.numero }} ({{ hab.tipo }})</mat-option
            >
          }
        </mat-select>
      </mat-form-field>
    }
  </form>
</mat-dialog-content>

<!-- ACCIONES DEL MODAL (FALTABAN) -->
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="guardando">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="form.invalid || guardando"
    (click)="guardar()"
  >
    {{ guardando ? "Procesando..." : "Confirmar" }}
  </button>
</mat-dialog-actions>
